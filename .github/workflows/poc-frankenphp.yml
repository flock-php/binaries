# Proof of concept: FrankenPHP for PHP 8.2–8.5 on macOS and native Windows (no WSL).
#   macOS    static-php-cli builds FrankenPHP with a thread-safe PHP and the same compiled-in
#            and shared extensions as Flock's php/php-fpm; tested again without Homebrew.
#   Windows  FrankenPHP's own Windows build method, linked against the official thread-safe
#            PHP build of each minor (upstream only publishes one for the newest PHP).
# Each package is smoke-tested like Octane uses it: CLI, extensions, a request, worker mode.
name: "PoC: FrankenPHP"

on:
  workflow_dispatch:
    inputs:
      php:
        description: PHP minors (JSON list)
        default: '["8.2", "8.3", "8.4", "8.5"]'
      frankenphp:
        description: FrankenPHP release (Windows)
        default: v1.13.0

permissions:
  contents: read

env:
  STATIC_EXTS: bcmath,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gmp,iconv,igbinary,intl,ldap,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib,apcu
  SHARED_EXTS: xdebug,imagick,pcov,mongodb,memcached

jobs:
  macos:
    name: macOS ${{ matrix.php }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php) }}
    env:
      SPC_VERSION: "2.8.5"
      TARGET: frankenphp
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash packages/php/macos/build.sh "${{ matrix.php }}" out
      - name: Portability (otool)
        run: bash scripts/verify-macos.sh out 13.0 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: bash scripts/smoke-frankenphp.sh out "${{ matrix.php }}" "$STATIC_EXTS"
      - name: Package
        if: always()
        run: tar -C out -cJf "frankenphp-php${{ matrix.php }}-macos-arm64.tar.xz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankenphp-php${{ matrix.php }}-macos-arm64
          path: frankenphp-php${{ matrix.php }}-macos-arm64.tar.xz
          retention-days: 14

  macos-portable:
    name: macOS ${{ matrix.php }} without Homebrew
    needs: macos
    if: always()
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frankenphp-php${{ matrix.php }}-macos-arm64
      - name: Hide Homebrew
        run: sudo mv /opt/homebrew /opt/homebrew.hidden
      - name: Smoke test
        run: |
          mkdir pkg && tar -C pkg -xJf "frankenphp-php${{ matrix.php }}-macos-arm64.tar.xz"
          bash scripts/smoke-frankenphp.sh pkg "${{ matrix.php }}" "$STATIC_EXTS"

  windows:
    name: Windows ${{ matrix.php }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packages/frankenphp/windows/build.ps1 -Php ${{ matrix.php }} -FrankenPHP ${{ inputs.frankenphp }} -Out out
      - name: Smoke test
        shell: pwsh
        run: ./scripts/windows/smoke-frankenphp.ps1 -Dir out -Php ${{ matrix.php }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankenphp-php${{ matrix.php }}-windows-x64
          path: out
          retention-days: 14

# Outside contributors open an issue first; a PR from them stays open only when it targets main
# and references an open issue, here or in flock-php/flock, that a maintainer has approved for it:
#   - labelled "help wanted": anyone may send a PR for it, or
#   - assigned to the PR's author: only they may (only maintainers can assign issues).
# Every other PR from a non-collaborator is closed with a comment pointing at CONTRIBUTING.md.
# Keep Settings > General > Pull requests at "All users"; this workflow does the gating.
name: PR gate

on:
  # pull_request_target, so the token can comment on and close PRs from forks. It never checks
  # out or runs the PR's code.
  pull_request_target:
    # "edited": a PR's base can be changed after it's opened.
    types: [opened, reopened, edited]

permissions:
  issues: read
  pull-requests: write

jobs:
  gate:
    name: Approved issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const OPEN_TO_ANYONE = 'help wanted';
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { owner, repo } = context.repo;

            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association) || pr.user.type === 'Bot') {
              core.info(`${author} is a collaborator or bot`);
              return;
            }
            // An org member whose membership is private shows up as a CONTRIBUTOR above; what they
            // may do in the repository says who they are.
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: author });
            if (['admin', 'write'].includes(access.permission)) {
              core.info(`${author} has ${access.permission} access`);
              return;
            }
            if (pr.state !== 'open') return;
            // An edit to the title or body doesn't re-check the issue; only a change of base does.
            if (context.payload.action === 'edited' && !context.payload.changes?.base) return;

            const close = async (reason) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `Thanks for the PR, @${author}! ${reason} See [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md).`,
              });
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
            };

            if (pr.base.ref !== 'main') {
              await close(`Pull requests go into \`main\`, not \`${pr.base.ref}\`, so this one is closed. Please open a new one against \`main\`.`);
              return;
            }
            if (context.payload.action === 'edited') return;

            // Issues the PR body references: "#123", or one in this repo or the other Flock repo
            // ("flock-php/flock#123" or a link to it). Work on Flock often spans both, so an
            // approved issue in either one counts.
            const REPOS = ['flock', 'binaries'];
            const body = pr.body ?? '';
            const refs = new Map();
            const add = (r, n) => refs.set(`${r}#${n}`, { repo: r, issue_number: Number(n) });
            for (const m of body.matchAll(/(?:^|[^\w/])#(\d+)\b/g)) add(repo, m[1]);
            const ref = new RegExp(`${owner}/(${REPOS.join('|')})(?:#|/issues/)(\\d+)\\b`, 'gi');
            for (const m of body.matchAll(ref)) add(m[1].toLowerCase(), m[2]);

            for (const [name, { repo: issueRepo, issue_number }] of refs) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo: issueRepo, issue_number }));
              } catch {
                continue;
              }
              if (issue.pull_request || issue.state !== 'open') continue;
              if (issue.labels.some(l => l.name === OPEN_TO_ANYONE)) {
                core.info(`${name} is labelled "${OPEN_TO_ANYONE}"`);
                return;
              }
              if (issue.assignees.some(a => a.login === author)) {
                core.info(`${name} is assigned to ${author}`);
                return;
              }
            }

            await close(
              'Flock takes pull requests only for issues a maintainer has approved, so this one is closed. ' +
              `Please open an issue describing the problem or idea first. Once it's labelled \`${OPEN_TO_ANYONE}\` or assigned to you, open a new PR against \`main\` that references it (e.g. \`Fixes #123\`).`,
            );

# Proof of concept (c): PHP's php-windows-builder action builds the extension DLLs Flock needs
# on Windows (the official PHP builds and windows.php.net no longer ship them), including
# imagick with its ImageMagick DLLs, for both the oldest (7.4) and newest PHP we support.
# Each DLL is then loaded into the official thread-safe PHP build of that version (TS, so the
# same DLLs also work in FrankenPHP).
name: "PoC: PHP extensions Windows"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.ext }} ${{ matrix.ref }} / PHP ${{ matrix.php }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ext: imagick,  repo: Imagick/imagick,           ref: "3.8.1",   php: "7.4", libs: ImageMagick-7 }
          - { ext: imagick,  repo: Imagick/imagick,           ref: "3.8.1",   php: "8.0", libs: ImageMagick-7 }
          - { ext: imagick,  repo: Imagick/imagick,           ref: "3.8.1",   php: "8.4", libs: ImageMagick-7 }
          - { ext: imagick,  repo: Imagick/imagick,           ref: "3.8.1",   php: "8.5", libs: ImageMagick-7 }
          - { ext: redis,    repo: phpredis/phpredis,         ref: "6.3.0",   php: "7.4" }
          - { ext: redis,    repo: phpredis/phpredis,         ref: "6.3.0",   php: "8.5" }
          # igbinary only enables itself for exactly "yes" (the builder passes "shared").
          # 3.2.17RC1: 3.2.16 includes ext/standard/php_smart_string.h, which PHP 8.5 removed.
          - { ext: igbinary, repo: igbinary/igbinary,         ref: "3.2.17RC1", php: "7.4", args: --enable-igbinary=yes }
          - { ext: igbinary, repo: igbinary/igbinary,         ref: "3.2.17RC1", php: "8.5", args: --enable-igbinary=yes }
          - { ext: apcu,     repo: krakjoe/apcu,              ref: "v5.1.28", php: "7.4" }
          - { ext: apcu,     repo: krakjoe/apcu,              ref: "v5.1.28", php: "8.5" }
          - { ext: pcov,     repo: krakjoe/pcov,              ref: "v1.0.12", php: "7.4" }
          - { ext: pcov,     repo: krakjoe/pcov,              ref: "v1.0.12", php: "8.5" }
    steps:
      - uses: actions/checkout@v4
      # Patched copy until https://github.com/php/php-windows-builder/issues/34 is fixed.
      - name: Prepare php-windows-builder
        shell: pwsh
        run: ./scripts/windows/prepare-builder.ps1
      - name: Build
        uses: ./.builder/extension
        with:
          extension-url: https://github.com/${{ matrix.repo }}
          extension-ref: ${{ matrix.ref }}
          php-version: ${{ matrix.php }}
          arch: x64
          ts: ts
          libs: ${{ matrix.libs }}
          args: ${{ matrix.args }}
          run-tests: false
      - name: List output
        shell: pwsh
        run: Get-ChildItem -Recurse artifacts | Select-Object FullName, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.ext }}-${{ matrix.php }}
          path: artifacts/*
          retention-days: 14

  # Loads every DLL into the official NTS build of its PHP version on a fresh runner.
  load:
    name: load into PHP ${{ matrix.php }}
    needs: build
    if: always()
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ext-*-${{ matrix.php }}
          path: exts
      - name: Load extensions
        shell: pwsh
        run: ./scripts/windows/test-php-exts.ps1 -Php ${{ matrix.php }} -Exts exts

  # Which VC++ runtime DLLs we would bundle (one current runtime serves vc15, vs16 and vs17 builds).
  vc-runtime:
    runs-on: windows-2022
    steps:
      - name: Locate the VC++ redistributable DLLs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          "Runtime folder: $($crt.FullName)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-ChildItem $crt.FullName | ForEach-Object { "- $($_.Name) ($([math]::Round($_.Length / 1KB)) KB)" } | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

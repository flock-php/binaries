# Daily: builds and publishes every package version in versions.json that isn't published yet,
# then rebuilds and signs the channel manifests (manifest.yml; also when nothing new was built).
# Flock downloads https://github.com/<repo>/releases/download/manifest/manifest.json (+ .sig), or
# manifest-beta.json / manifest-experimental.json for those channels.
#   php-macos  PHP and FrankenPHP for macOS (build-php-macos.yml)
#   php-exts-windows    extension packs for Windows PHP, one per minor (build-php-exts-windows.yml)
#   frankenphp-windows  FrankenPHP for Windows (build-frankenphp-windows.yml)
#   builds     services built from source: PostgreSQL, MariaDB (macOS), Valkey, Redis (build-service.yml)
#   mirrors    mirrored from the vendor: PHP for Windows, MySQL, MongoDB, Node.js, ... (mirror.yml)
name: Release

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      php:
        description: Only these PHP versions, comma-separated (default the newest of each minor)
        default: ""
      packages:
        description: Only these packages, comma-separated, also "php", "php-exts", "frankenphp" (default all)
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      php_macos: ${{ steps.plan.outputs.php_macos }}
      php_exts_windows: ${{ steps.plan.outputs.php_exts_windows }}
      frankenphp_windows: ${{ steps.plan.outputs.frankenphp_windows }}
      builds: ${{ steps.plan.outputs.builds }}
      mirrors: ${{ steps.plan.outputs.mirrors }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/flockrel/go.mod
          cache: false
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PHP: ${{ inputs.php }}
          PACKAGES: ${{ inputs.packages }}
        run: go -C tools/flockrel run . plan -versions ../../versions.json -php "$PHP" -packages "$PACKAGES"

  php-macos:
    needs: plan
    if: needs.plan.outputs.php_macos != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.php_macos) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-php-macos.yml
    with:
      version: ${{ matrix.version }}
      package: ${{ matrix.package }}
      publish: true
      optional: ${{ matrix.optional == true }}

  php-exts-windows:
    needs: plan
    if: needs.plan.outputs.php_exts_windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.php_exts_windows) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-php-exts-windows.yml
    with:
      minor: ${{ matrix.version }}
      publish: true
      optional: ${{ matrix.optional == true }}

  frankenphp-windows:
    needs: plan
    if: needs.plan.outputs.frankenphp_windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.frankenphp_windows) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-frankenphp-windows.yml
    with:
      version: ${{ matrix.version }}
      publish: true
      optional: ${{ matrix.optional == true }}

  builds:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-service.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      platform: ${{ matrix.platform }}
      publish: true

  mirrors:
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mirrors) }}
    permissions:
      contents: write
    uses: ./.github/workflows/mirror.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      platform: ${{ matrix.platform }}
      publish: true

  manifest:
    needs: [plan, php-macos, php-exts-windows, frankenphp-windows, builds, mirrors]
    # Also after failed builds: whatever did get published belongs in the manifests.
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/manifest.yml
    secrets: inherit

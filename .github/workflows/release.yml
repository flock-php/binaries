# Daily: builds and publishes every package version in versions.json that isn't published yet,
# then rebuilds and signs the manifest (also when nothing new was built, so it never expires).
# Flock downloads https://github.com/<repo>/releases/download/manifest/manifest.json (+ .sig).
#   php-macos  PHP and FrankenPHP for macOS (build-php-macos.yml)
#   php-exts-windows    extension packs for Windows PHP, one per minor (build-php-exts-windows.yml)
#   frankenphp-windows  FrankenPHP for Windows (build-frankenphp-windows.yml)
#   builds     services built from source: PostgreSQL, MariaDB (macOS), Valkey, Redis (build-service.yml)
#   mirrors    mirrored from the vendor: PHP for Windows, MySQL, MongoDB, Node.js, ... (mirror.yml)
name: Release

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      php:
        description: Only these PHP versions, comma-separated (default the newest of each minor)
        default: ""
      packages:
        description: Only these packages, comma-separated, also "php", "php-exts", "frankenphp" (default all)
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      php_macos: ${{ steps.plan.outputs.php_macos }}
      php_exts_windows: ${{ steps.plan.outputs.php_exts_windows }}
      frankenphp_windows: ${{ steps.plan.outputs.frankenphp_windows }}
      builds: ${{ steps.plan.outputs.builds }}
      mirrors: ${{ steps.plan.outputs.mirrors }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/flockrel/go.mod
          cache: false
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PHP: ${{ inputs.php }}
          PACKAGES: ${{ inputs.packages }}
        run: go -C tools/flockrel run . plan -versions ../../versions.json -php "$PHP" -packages "$PACKAGES"

  php-macos:
    needs: plan
    if: needs.plan.outputs.php_macos != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.php_macos) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-php-macos.yml
    with:
      version: ${{ matrix.version }}
      package: ${{ matrix.package }}
      publish: true

  php-exts-windows:
    needs: plan
    if: needs.plan.outputs.php_exts_windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.php_exts_windows) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-php-exts-windows.yml
    with:
      minor: ${{ matrix.version }}
      publish: true

  frankenphp-windows:
    needs: plan
    if: needs.plan.outputs.frankenphp_windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.frankenphp_windows) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-frankenphp-windows.yml
    with:
      version: ${{ matrix.version }}
      publish: true

  builds:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-service.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      platform: ${{ matrix.platform }}
      publish: true

  mirrors:
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mirrors) }}
    permissions:
      contents: write
    uses: ./.github/workflows/mirror.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      platform: ${{ matrix.platform }}
      publish: true

  manifest:
    needs: [plan, php-macos, php-exts-windows, frankenphp-windows, builds, mirrors]
    # Also after failed builds: whatever did get published belongs in the manifest.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/flockrel/go.mod
          cache: false
      - name: Build and sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          go -C tools/flockrel build -o "$RUNNER_TEMP/flockrel" .
          "$RUNNER_TEMP/flockrel" manifest -versions versions.json -out "$RUNNER_TEMP"
          # The public key in the repo is the one Flock ships: catches a wrong secret.
          "$RUNNER_TEMP/flockrel" verify -pub manifest.pub "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/manifest.json.sig" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          gh release view manifest >/dev/null 2>&1 \
            || gh release create manifest --title "Manifest" --latest=false \
                 --notes "Signed list of every published package. Rebuilt by the Release workflow."
          gh release upload manifest "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/manifest.json.sig" --clobber

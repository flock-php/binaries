# Builds one PHP release for Linux (x64 or arm64) with static-php-cli, tests it, and publishes it
# on the <package>-<version> release as <package>-<version>-build<N>-<platform>.tar.gz:
#   php         bin/php and bin/php-fpm (build number: php.linux.build)
#   frankenphp  bin/frankenphp with the same PHP embedded, thread-safe (frankenphp.linux.build,
#               FrankenPHP release: frankenphp.version)
# Both get the compiled-in extensions and the shared ones in ext/ from php.linux in versions.json.
# Built against glibc on the oldest Ubuntu LTS Flock supports, on the platform's own architecture.
# Called by release.yml for every version without that build yet; run it by hand to test a build
# without publishing. Nothing is published unless every check passed, and a published asset is
# never replaced.
name: Build PHP Linux

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      package:
        type: string
        default: php
      platform:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      # FrankenPHP on a PHP release candidate: a failure is a warning (release.yml tries again the next day).
      optional:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: PHP version (major.minor.patch)
        required: true
      package:
        description: What to build
        type: choice
        options: [php, frankenphp]
      platform:
        description: Platform
        type: choice
        options: [linux-x64, linux-arm64]
      publish:
        description: Publish the package as a release asset
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  PKG: ${{ inputs.package }}
  PLATFORM: ${{ inputs.platform }}

jobs:
  build:
    name: build ${{ inputs.package }} ${{ inputs.version }} ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    continue-on-error: ${{ inputs.optional == true }}
    outputs:
      asset: ${{ steps.config.outputs.asset }}
      ok: ${{ steps.done.outputs.ok }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Read versions.json
        id: config
        run: |
          jq -r '.php.linux | "SPC_VERSION=\(.spc)\nSTATIC_EXTS=\(.static_extensions)\nSHARED_EXTS=\(.shared_extensions)"' versions.json >> "$GITHUB_ENV"
          echo "MINOR=$(cut -d. -f1-2 <<<"$VERSION")" >> "$GITHUB_ENV"
          case "$PKG" in
            php) build="$(jq -r .php.linux.build versions.json)" ;;
            frankenphp)
              build="$(jq -r .frankenphp.linux.build versions.json)"
              echo "TARGET=frankenphp" >> "$GITHUB_ENV"
              echo "FRANKENPHP_VERSION=$(jq -r .frankenphp.version versions.json)" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown package $PKG"; exit 1 ;;
          esac
          echo "BUILD=$build" >> "$GITHUB_ENV"
          asset="$PKG-$VERSION-build$build-$PLATFORM.tar.gz"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Cache static-php-cli downloads
        uses: actions/cache@v6
        with:
          path: spc-work/downloads
          key: spc-downloads-${{ env.SPC_VERSION }}-${{ inputs.platform }}-${{ inputs.package }}-${{ inputs.version }}-${{ hashFiles('versions.json') }}
          restore-keys: spc-downloads-${{ env.SPC_VERSION }}-${{ inputs.platform }}-${{ inputs.package }}-${{ env.MINOR }}

      - name: Build
        run: bash packages/php/linux/build.sh "$VERSION" out

      - name: Portability (readelf)
        run: bash scripts/verify-linux.sh out | tee -a "$GITHUB_STEP_SUMMARY"

      # Every shared extension in versions.json has to build and load for a release.
      - name: Smoke test
        run: bash scripts/smoke-php-package.sh "$PKG" out

      - name: Package
        run: |
          jq -n --arg package "$PKG" --arg version "$VERSION" --argjson build "$BUILD" --arg platform "$PLATFORM" \
                --arg commit "$GITHUB_SHA" --arg spc "$SPC_VERSION" --arg static "$STATIC_EXTS" --arg shared "$SHARED_EXTS" \
                --arg glibc "$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')" \
                --arg frankenphp "${FRANKENPHP_VERSION:-}" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{package: $package, version: $version, build: $build, platform: $platform, min_glibc: $glibc,
              built: $built, commit: $commit, static_php_cli: $spc,
              extensions: {compiled_in: ($static | split(",")), shared: ($shared | split(","))}}
             + (if $frankenphp != "" then {frankenphp: $frankenphp} else {} end)' \
            > out/flock-package.json
          tar -C out -czf "$ASSET" .
          sha256sum "$ASSET" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 7
      - id: done
        run: echo ok=true >> "$GITHUB_OUTPUT"
      - if: failure() && inputs.optional
        run: echo "::warning::$PKG for PHP $VERSION (a release candidate) didn't build; the next release run tries again"

  # A fresh runner of the architecture, without the libraries static-php-cli's doctor installed.
  portable:
    name: run ${{ inputs.package }} ${{ inputs.version }} ${{ inputs.platform }} on a fresh runner
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    continue-on-error: ${{ inputs.optional == true }}
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    env:
      ASSET: ${{ needs.build.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ASSET }}
      - name: Read versions.json
        run: jq -r '.php.linux | "STATIC_EXTS=\(.static_extensions)\nSHARED_EXTS=\(.shared_extensions)"' versions.json >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          mkdir pkg && tar -C pkg -xzf "$ASSET"
          bash scripts/smoke-php-package.sh "$PKG" pkg
      - id: done
        run: echo ok=true >> "$GITHUB_OUTPUT"
      - if: failure() && inputs.optional
        run: echo "::warning::$PKG for PHP $VERSION (a release candidate) failed on a fresh runner; the next release run tries again"

  publish:
    needs: [build, portable]
    if: inputs.publish && needs.portable.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSET: ${{ needs.build.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ASSET }}
      - run: bash scripts/publish.sh "$PKG" "$VERSION" "$ASSET"

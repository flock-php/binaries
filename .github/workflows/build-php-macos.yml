# Builds one PHP release for macOS (Apple Silicon) with static-php-cli, tests it, and publishes
# it on the <package>-<version> release as <package>-<version>-build<N>-macos-arm64.tar.gz:
#   php         bin/php and bin/php-fpm (build number: php.macos.build)
#   frankenphp  bin/frankenphp with the same PHP embedded, thread-safe (frankenphp.macos.build,
#               FrankenPHP release: frankenphp.version)
# Both get the compiled-in extensions and the shared ones in ext/ from php.macos in versions.json.
# Called by release.yml for every version without that build yet; run it by hand to test a build
# without publishing. Nothing is published unless every check passed, and a published asset is
# never replaced.
name: Build PHP macOS

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      package:
        type: string
        default: php
      publish:
        type: boolean
        default: false
      # FrankenPHP on a PHP release candidate: a failure is a warning (release.yml tries again the next day).
      optional:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: PHP version (major.minor.patch)
        required: true
      package:
        description: What to build
        type: choice
        options: [php, frankenphp]
      publish:
        description: Publish the package as a release asset
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  PKG: ${{ inputs.package }}

jobs:
  build:
    name: build ${{ inputs.package }} ${{ inputs.version }}
    runs-on: macos-15
    timeout-minutes: 120
    continue-on-error: ${{ inputs.optional == true }}
    outputs:
      asset: ${{ steps.config.outputs.asset }}
      ok: ${{ steps.done.outputs.ok }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Read versions.json
        id: config
        run: |
          jq -r '.php.macos | "SPC_VERSION=\(.spc)\nMIN_OS=\(.min_os)\nSTATIC_EXTS=\(.static_extensions)\nSHARED_EXTS=\(.shared_extensions)"' versions.json >> "$GITHUB_ENV"
          echo "MINOR=$(cut -d. -f1-2 <<<"$VERSION")" >> "$GITHUB_ENV"
          case "$PKG" in
            php) build="$(jq -r .php.macos.build versions.json)" ;;
            frankenphp)
              build="$(jq -r .frankenphp.macos.build versions.json)"
              echo "TARGET=frankenphp" >> "$GITHUB_ENV"
              echo "FRANKENPHP_VERSION=$(jq -r .frankenphp.version versions.json)" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown package $PKG"; exit 1 ;;
          esac
          echo "BUILD=$build" >> "$GITHUB_ENV"
          asset="$PKG-$VERSION-build$build-macos-arm64.tar.gz"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Cache static-php-cli downloads
        uses: actions/cache@v6
        with:
          path: spc-work/downloads
          key: spc-downloads-${{ env.SPC_VERSION }}-${{ inputs.package }}-${{ inputs.version }}-${{ hashFiles('versions.json') }}
          restore-keys: spc-downloads-${{ env.SPC_VERSION }}-${{ inputs.package }}-${{ env.MINOR }}

      - name: Build
        run: MACOSX_DEPLOYMENT_TARGET="$MIN_OS" bash packages/php/macos/build.sh "$VERSION" out

      - name: Portability (otool)
        run: bash scripts/verify-macos.sh out "$MIN_OS" | tee -a "$GITHUB_STEP_SUMMARY"

      # Every shared extension in versions.json has to build and load for a release.
      - name: Smoke test
        run: bash scripts/smoke-php-package.sh "$PKG" out

      - name: Package
        run: |
          jq -n --arg package "$PKG" --arg version "$VERSION" --argjson build "$BUILD" --arg commit "$GITHUB_SHA" \
                --arg spc "$SPC_VERSION" --arg min_os "$MIN_OS" --arg static "$STATIC_EXTS" --arg shared "$SHARED_EXTS" \
                --arg frankenphp "${FRANKENPHP_VERSION:-}" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{package: $package, version: $version, build: $build, platform: "macos-arm64", min_os: $min_os,
              built: $built, commit: $commit, static_php_cli: $spc,
              extensions: {compiled_in: ($static | split(",")), shared: ($shared | split(","))}}
             + (if $frankenphp != "" then {frankenphp: $frankenphp} else {} end)' \
            > out/flock-package.json
          tar -C out -czf "$ASSET" .
          shasum -a 256 "$ASSET" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 7
      - id: done
        run: echo ok=true >> "$GITHUB_OUTPUT"
      - if: failure() && inputs.optional
        run: echo "::warning::$PKG for PHP $VERSION (a release candidate) didn't build; the next release run tries again"

  # The oldest Apple Silicon runner with Homebrew moved away: closest to a user's Mac.
  portable:
    name: run ${{ inputs.package }} ${{ inputs.version }} without Homebrew
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: macos-14
    continue-on-error: ${{ inputs.optional == true }}
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    env:
      ASSET: ${{ needs.build.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ASSET }}
      # Before Homebrew goes: jq is one of its tools.
      - name: Read versions.json
        run: jq -r '.php.macos | "STATIC_EXTS=\(.static_extensions)\nSHARED_EXTS=\(.shared_extensions)"' versions.json >> "$GITHUB_ENV"
      - name: Hide Homebrew
        run: sudo mv /opt/homebrew /opt/homebrew.hidden
      - name: Smoke test
        run: |
          mkdir pkg && tar -C pkg -xzf "$ASSET"
          bash scripts/smoke-php-package.sh "$PKG" pkg
      - id: done
        run: echo ok=true >> "$GITHUB_OUTPUT"
      - if: failure() && inputs.optional
        run: echo "::warning::$PKG for PHP $VERSION (a release candidate) failed without Homebrew; the next release run tries again"

  publish:
    needs: [build, portable]
    if: inputs.publish && needs.portable.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSET: ${{ needs.build.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ASSET }}
      - run: bash scripts/publish.sh "$PKG" "$VERSION" "$ASSET"

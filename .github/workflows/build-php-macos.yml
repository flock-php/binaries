# Builds one PHP release for macOS (Apple Silicon) with static-php-cli, tests it, and publishes
# it as php-<version>-macos-arm64.tar.gz on the php-<version> release. Called by release.yml for
# every version that isn't published yet; run it by hand to test a build without publishing.
# Nothing is published unless every check passed, and a published asset is never replaced.
name: Build PHP macOS

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: PHP version (major.minor.patch)
        required: true
      publish:
        description: Publish the package as a release asset
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  ASSET: php-${{ inputs.version }}-macos-arm64.tar.gz

jobs:
  build:
    name: build ${{ inputs.version }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Read versions.json
        run: |
          jq -r '.php.macos | "SPC_VERSION=\(.spc)\nMIN_OS=\(.min_os)\nSTATIC_EXTS=\(.static_extensions)\nSHARED_EXTS=\(.shared_extensions)"' versions.json >> "$GITHUB_ENV"
          echo "MINOR=$(cut -d. -f1-2 <<<"$VERSION")" >> "$GITHUB_ENV"

      - name: Cache static-php-cli downloads
        uses: actions/cache@v6
        with:
          path: spc-work/downloads
          key: spc-downloads-${{ env.SPC_VERSION }}-${{ inputs.version }}-${{ hashFiles('versions.json') }}
          restore-keys: spc-downloads-${{ env.SPC_VERSION }}-${{ env.MINOR }}

      - name: Build
        run: MACOSX_DEPLOYMENT_TARGET="$MIN_OS" bash packages/php/macos/build.sh "$VERSION" out

      - name: Portability (otool)
        run: bash scripts/verify-macos.sh out "$MIN_OS" | tee -a "$GITHUB_STEP_SUMMARY"

      # Every shared extension in versions.json has to build and load for a release.
      - name: Smoke test
        run: REQUIRE_SHARED=1 bash scripts/smoke-php.sh out "$STATIC_EXTS" "$SHARED_EXTS"

      - name: Package
        run: |
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg spc "$SPC_VERSION" \
                --arg min_os "$MIN_OS" --arg static "$STATIC_EXTS" --arg shared "$SHARED_EXTS" \
                --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{package: "php", version: $version, platform: "macos-arm64", min_os: $min_os,
              built: $built, commit: $commit, static_php_cli: $spc,
              extensions: {compiled_in: ($static | split(",")), shared: ($shared | split(","))}}' \
            > out/flock-package.json
          tar -C out -czf "$ASSET" .
          shasum -a 256 "$ASSET" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 7

  # The oldest Apple Silicon runner with Homebrew moved away: closest to a user's Mac.
  portable:
    name: run ${{ inputs.version }} without Homebrew
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ASSET }}
      - name: Hide Homebrew
        run: sudo mv /opt/homebrew /opt/homebrew.hidden
      - name: Smoke test
        run: |
          mkdir pkg && tar -C pkg -xzf "$ASSET"
          REQUIRE_SHARED=1 bash scripts/smoke-php.sh pkg \
            "$(jq -r '.php.macos.static_extensions' versions.json)" \
            "$(jq -r '.php.macos.shared_extensions' versions.json)"

  publish:
    needs: [build, portable]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: php-${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ASSET }}
      - name: Upload release asset
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "PHP $VERSION" --latest=false \
                 --notes "PHP $VERSION built for Flock. Packages are listed in the signed manifest."
          # No --clobber: a published asset is never replaced.
          gh release upload "$TAG" "$ASSET"
